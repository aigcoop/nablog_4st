<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 블로그 수업 프롬프트북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 휴대폰 한 줄 세로 흐름. 교안 순서대로 번호가 붙은 프롬프트 카드, 사이사이에 화면 따라하기 안내 줄. */
:root{
  --paper:#f4f6f3;
  --card:#ffffff;
  --ink:#16241d;
  --muted:#5b6b62;
  --line:#d5ddd6;
  --green:#0a7a45;
  --green-ink:#ffffff;
  --marker:#ffe94a;
  --marker-ink:#16241d;
  --soft:#e8efe9;
  --display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1612;--card:#18221c;--ink:#e9f0ea;--muted:#9eb0a5;--line:#2c3a31;
    --green:#35c27c;--green-ink:#06130c;--marker:#ffe94a;--marker-ink:#16241d;--soft:#202c25;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1612;--card:#18221c;--ink:#e9f0ea;--muted:#9eb0a5;--line:#2c3a31;
  --green:#35c27c;--green-ink:#06130c;--marker:#ffe94a;--marker-ink:#16241d;--soft:#202c25;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px;scroll-behavior:smooth;scroll-padding-top:70px}
html.big{font-size:20px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
header.top{padding:28px 0 14px}
.kicker{font-size:.8rem;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.2;margin:6px 0 10px;text-wrap:balance}
h1 span{background:linear-gradient(transparent 55%,var(--marker) 55%);color:var(--ink)}
:root[data-theme="dark"] h1 span{color:var(--marker-ink);background:var(--marker);padding:0 4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1 span{color:var(--marker-ink);background:var(--marker);padding:0 4px}}
.lead{margin:0;color:var(--muted);font-size:.95rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.tools .count{font-weight:700;font-variant-numeric:tabular-nums;margin-right:auto}
button{font-family:inherit;font-size:1rem;cursor:pointer;color:inherit}
.ghost{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:2px}

nav.chips{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto}
nav.chips a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600;white-space:nowrap}

section.part{margin-top:34px}
.part-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:12px}
.part-head h2{font-size:1.25rem;margin:0;font-weight:700}
.pages{font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}

.note{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.note b{flex:none;font-size:.75rem;border:1.5px solid var(--muted);color:var(--muted);border-radius:6px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.note .pages{display:block}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.done{border-color:var(--green)}
.card-head{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;min-width:2.5rem;height:2.5rem;padding:0 8px;border-radius:10px;background:var(--marker);color:var(--marker-ink);font-family:var(--display);font-size:1.35rem;display:flex;align-items:center;justify-content:center}
.card.done .num{background:var(--green);color:var(--green-ink)}
.card h3{margin:0;font-size:1.1rem;line-height:1.35}
.where{margin:0;font-size:.88rem;color:var(--muted)}
.where strong{color:var(--ink)}
label.fill{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
label.fill input{font:inherit;font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
pre.prompt{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:.95rem;line-height:1.65;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;max-height:17rem;overflow:auto}
pre.prompt mark{background:var(--marker);color:var(--marker-ink);padding:0 3px;border-radius:3px}
.copy{border:0;background:var(--green);color:var(--green-ink);font-weight:700;font-size:1.05rem;border-radius:12px;padding:13px 16px;width:100%}
.copy.ok{background:var(--ink);color:var(--paper)}
.sub{font-size:.8rem;color:var(--muted);margin:0}
.choice{font-size:.78rem;font-weight:700;color:var(--green);margin:0}
footer{margin-top:40px;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
.menu{display:grid;gap:10px;margin-top:10px}
.menu a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;font-size:1.15rem;line-height:1.35}
.menu a .no{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--green);color:var(--green-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.25rem;font-weight:400}
.menu a small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.menu a.all{background:var(--ink);color:var(--paper);border-color:var(--ink);padding:18px 16px}
.menu a.all small{color:inherit;opacity:.75}
.menu a[aria-current="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
nav.chips a[aria-current="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
body:not(.open) nav.chips{display:none}
nav.chips{margin-top:22px}
.actions{display:flex;gap:8px}
.actions .copy{flex:1;min-width:0}
.share{flex:none;border:1.5px solid var(--green);background:var(--card);color:var(--green);font-weight:700;font-size:1.05rem;border-radius:12px;padding:13px 18px}
.empty{background:var(--soft);border-radius:12px;padding:16px;font-size:.95rem;color:var(--muted)}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs img{height:110px;width:auto;border-radius:10px;border:1px solid var(--line);flex:none}
.files{list-style:none;margin:0;padding:0}
.files li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;padding:8px 0;border-bottom:1px solid var(--line)}
.files a{flex:none;color:var(--green);font-weight:700;text-decoration:none;white-space:nowrap;padding:4px 0}
.find{font:inherit;font-size:1rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
.grp{font-size:.78rem;font-weight:700;color:var(--green)}
details.more summary{cursor:pointer;font-size:.9rem;font-weight:600;color:var(--muted);padding:4px 0}
.grp-btn[aria-expanded="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.subs{display:grid;gap:8px;background:var(--soft);border-radius:16px;padding:12px}
.catbar{display:flex;flex-wrap:wrap;gap:8px}
.catbar button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.92rem;font-weight:600}
.catbar button b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.catbar button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.catbar button[aria-pressed="true"] b{color:inherit}
h3.cat-head{margin:14px 0 0;font-size:1.15rem;padding-left:10px;border-left:5px solid var(--marker)}
.menu{gap:12px;margin-top:18px}
.menu .grp-btn{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:18px 16px;font-weight:700;font-size:1.25rem;line-height:1.3;text-decoration:none}
.menu .grp-btn small{display:block;margin-top:3px;font-size:.82rem;font-weight:500;color:var(--muted)}
.menu .grp-btn .no{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--green);color:var(--green-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.35rem;font-weight:400}
.menu .grp-btn[aria-expanded="true"]{border-color:var(--green)}
.chev{margin-left:auto;font-style:normal;font-size:1.5rem;color:var(--muted);line-height:1;flex:none}
.chev::after{content:"\203A"}
.grp-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.subs{margin:-4px 0 4px 18px;padding:10px;gap:8px}
.subs a{font-size:1.05rem;padding:12px 14px;border-radius:12px}
.menu a.allrow{justify-content:center;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-size:1.1rem;font-weight:700;padding:15px 16px;border-radius:18px}
.tools{margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
body:not(.open) footer{display:none}
header.top{padding-bottom:0}
.bundle{border:2px solid var(--green);border-radius:18px;background:var(--card);padding:14px 16px 4px}
.bundle-head{display:flex;flex-direction:column;gap:2px;padding-bottom:10px}
.bundle-head b{font-size:1.1rem}
.bundle-head span{font-size:.88rem;color:var(--muted)}
.bundle .card{border:0;border-top:1px dashed var(--line);border-radius:0;background:transparent;padding:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">지쿱 링크오더를 활용한 네이버 블로그 (모바일 버전) 교안용</div>
    <h1><span>수업 프롬프트북</span></h1>
  </header>
  <div class="menu" id="menu" aria-label="수업 단계 바로가기"></div>
  <nav class="chips" id="chips" aria-label="수업 단계"></nav>
  <main id="main"></main>
  <div class="tools">
      <span class="count" id="count"></span>
      <button class="ghost" id="bigBtn" type="button">글자 크게</button>
      <button class="ghost" id="resetBtn" type="button">복사 표시 지우기</button>
    </div>
  <footer>빈칸이 있는 프롬프트는 칸에 내용을 적으면 자동으로 들어가요. 복사한 프롬프트는 번호가 초록색으로 바뀌어요.</footer>
</div>

<script src="samples-data.js"></script>
<script>
const SKILL_BODY = `Instructions
역할 및 정체성
당신은 네이버 블로그 전문 브랜딩 디렉터이자 SEO 기반 카피라이터입니다. 블로그 개설자나 리뉴얼을 원하는 사용자의 주요 주제, 타깃 독자, 운영 목표, 퍼스널 브랜딩 방향성을 분석하여 최적의 블로그명, 닉네임(별명), 모바일/PC 프로필 소개글, 카테고리 네이밍을 체계적으로 기획해 줍니다.

출력 형식 필수 규칙
출력값에 이모티콘 없음.
출력값에 특수기호 없음. (장식용 기호, 이모지 등을 일절 사용하지 않고 깔끔한 텍스트로만 작성)

핵심 원칙
검색 노출(SEO)과 직관성의 조화:
네이버 검색 알고리즘과 스마트블록 특성을 고려해 핵심 키워드가 자연스럽게 녹아들면서도 독자가 한눈에 기억하기 쉬운 이름을 만듭니다.
신뢰도와 페르소나 구축:
모호하거나 추상적인 표현 대신 구체적인 전문 분야, 혜택, 활동 지역, 독특한 차별점을 명확히 살립니다.
가독성 최적화:
네이버 모바일 환경(글자 수 제한, 줄바꿈)을 고려해 스마트폰 화면에서 잘리지 않고 직관적으로 읽히는 글자 수로 기획합니다.

기본 작동 프로세스
사용자가 주제나 브랜딩 요청을 전달하면 다음 4가지 영역을 패키지 형태로 체계적으로 제안합니다.

1. 블로그명 (5가지 스타일 제안)
직관/키워드형: 검색에 유리하고 무엇을 다루는지 바로 알 수 있는 형태
페르소나/전문가형: 운영자의 역할, 직함, 아이덴티티가 강조된 형태
스토리/감성형: 독자에게 친근감과 공감을 주는 부드러운 형태
타깃/혜택형: 독자가 얻을 수 있는 구체적인 가치를 전면에 내세운 형태
위트/언어유희형: 기억하기 쉽고 입에 착 붙는 형태

2. 별명 (닉네임) 추천 (5가지 옵션)
블로그 검색 및 댓글 소통에 친근한 2~4글자 위주의 네이밍
호칭 뒤에 '님'을 붙였을 때 자연스럽고 발음하기 편한 이름
전문직 느낌, 친근한 이웃 느낌, 브랜드 캐릭터 느낌 등 다각도 제안

3. 네이버 프로필 소개글 (3가지 버전)
A버전 (모바일 최적화 초압축형 - 100자 내외): 모바일 앱 첫 화면에서 한눈에 보이는 간결한 소개 (줄바꿈 고려)
B버전 (스토리텔링형 - 200자 내외): 운영자의 철학, 시작한 계기, 독자에게 전하고 싶은 가치 강조
C버전 (비즈니스/전문가형 - 200자 내외): 경력, 이력, 전문 분야, 제공하는 콘텐츠 및 협업/문의 안내 포함

4. 카테고리 구성 가이드 (보너스 제안)
C-Rank 및 전문성 축적을 위한 대주제 5~6개, 각 대주제별 소주제 2개 내외의 구조 제안
네이버 블로그 카테고리 설정 특성상 특수기호는 일절 사용하지 않음
화면에서 카테고리 제목이 잘리지 않도록 글자 수를 최대한 요약하여(공백 포함 10자 이내 권장) 직관적이고 쉽게 설정할 수 있는 간결한 명칭으로 제안

상호작용 규칙
사용자가 정보 없이 "블로그 기획해줘" 또는 "네이버 블로그 기본 세팅해줘"라고만 할 경우:
블로그에서 주로 다룰 메인 주제 (예: AI 교육, 농산물 공동구매, 뷰티/헬스케어 등)
주 타깃 독자층 (예: 왕초보 시니어, 주부, 소상공인 등)
블로그 운영 목적 (수익화, 퍼스널 브랜딩, 제품 판매, 제휴/강의 유치)
선호하는 분위기 (친근하고 따뜻함, 전문적이고 신뢰감 있음, 트렌디함)
위 4가지를 묻는 간결한 질문을 먼저 건네세요.
사용자가 구체적인 정보를 제공하면 즉시 완성도 높은 기획안 4단계를 이모티콘과 특수기호 없이 깔끔한 서식으로 출력하세요.`;

const WRITE_FULL = `제공된 소스의 사실만 바탕으로 "{{v}}" 제목에 맞춰 네이버 블로그 글을 작성해 주세요.

[글 작성 패턴]
1. 공감되는 도입(고민·상황 짚기)
2. 핵심 요약(한눈에 보는 포인트)
3. 상세 특징 및 활용법(소제목 나누어 정리)
4. 요약 및 마무리 안내(정리 및 다음 행동 안내)

[작성 규칙]
- 제목의 핵심 키워드를 도입부, 소제목, 본문에 자연스럽게 포함해 주세요.
- 모바일에서 읽기 쉽게 짧은 문장과 문단 줄바꿈을 사용해 주세요.
- 소스에 없는 내용은 추측하지 말고, 과장된 표현 없이 친절하고 객관적으로 작성해 주세요.
- 마지막에 관련 해시태그 5개를 적어 주세요.`;

const SLIDES = `선택된 블로그 글의 전체 흐름과 맥락에 맞춰, 총 8장의 슬라이드를 한 번에 묶음 슬라이드 형태로 만들어 주세요.

[8장 슬라이드 전체 구성 규칙]

 '<a class="grp-btn" href="#library" data-go="library"><span class="no">3</span><span>제품 자료실<small>제품 이미지와 설명서 받기</small></span><i class="chev" aria-hidden="true"></i></a>';
PARTS.forEach(p=>{
  const idx=PARTS.indexOf(p)+1, ns=p.items.filter(i=>i.n).map(i=>i.n.split("-")[0]);
  const range=p.sub?p.sub:ns.length?("프롬프트 "+(ns[0]===ns[ns.length-1]?ns[0]:ns[0]+"~"+ns[ns.length-1])+"번"):"화면 따라하기";
  const a=document.createElement("a");a.href="#"+p.id;a.dataset.go=p.id;a.textContent=p.chip;chips.appendChild(a);
  const m=document.createElement("a");m.href="#"+p.id;m.dataset.go=p.id;
  m.innerHTML='<span>'+p.chip+'<small>'+range+' · '+p.pages+'</small></span><i class="chev" aria-hidden="true"></i>';if(p.group)document.getElementById("subs-"+p.group).appendChild(m);
  const sec=document.createElement("section");sec.className="part";sec.id="sec-"+p.id;
  sec.innerHTML='<div class="part-head"><h2>'+p.title+'</h2><span class="pages">'+p.pages+'</span></div>';
  const stack=document.createElement("div");stack.className="stack";sec.appendChild(stack);
  let bEl=null;
  p.items.forEach(it=>{
    let host=stack;
    if(it.bundle){
      if(!bEl){bEl=document.createElement("div");bEl.className="bundle";
        bEl.innerHTML='<div class="bundle-head"><b>스킬 하나 만들기</b><span>한 화면에 있는 세 칸이에요. 이름, 설명, 요청사항 순서로 복사해 붙여넣어요.</span></div>';stack.appendChild(bEl)}
      host=bEl;
    }else bEl=null;
    if(it.note){
      const d=document.createElement("div");d.className="note";
      d.innerHTML='<b>화면 따라하기</b><div>'+it.note+'<span class="pages">'+it.pages+'</span></div>';
      host.appendChild(d);return;
    }
    const id="p"+it.n, c=document.createElement("article");
    c.className="card"+(copied.has(id)?" done":"");
    c.innerHTML=(it.choice?'<p class="choice">'+it.choice+'</p>':'')+
      '<div class="card-head"><div class="num">'+it.n+'</div><div><h3>'+it.title+'</h3><span class="pages">'+it.pages+'</span></div></div>'+
      '<p class="where">'+it.where+'</p>'+
      (it.fill?'<label class="fill" for="in-'+id+'">'+it.fill+'<input id="in-'+id+'" type="text" autocomplete="off" placeholder="'+it.ph+'"></label>':'')+
      '<pre class="prompt" tabindex="0"></pre>'+
      '<div class="actions"><button class="copy" type="button">'+it.n+'번 복사하기</button>'+(CAN_SHARE?'<button class="share" type="button">공유</button>':'')+'</div>';
    const pre=c.querySelector("pre"),btn=c.querySelector(".copy"),inp=c.querySelector("input");
    const draw=()=>{pre.innerHTML=fillText(it,inp?inp.value:"",true)};
    draw(); if(inp) inp.addEventListener("input",draw);
    btn.addEventListener("click",async()=>{
      const t=fillText(it,inp?inp.value:"",false); let ok=false;
      try{await navigator.clipboard.writeText(t);ok=true}catch(e){
        const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
        document.body.appendChild(ta);ta.select();try{ok=document.execCommand("copy")}catch(e2){}ta.remove();
      }
      if(ok){
        copied.add(id);save();c.classList.add("done");updateCount();
        btn.textContent="복사됐어요. 붙여넣기 하세요";btn.classList.add("ok");
        setTimeout(()=>{btn.textContent=it.n+"번 복사하기";btn.classList.remove("ok")},2200);
      }else{
        btn.textContent="복사가 안 됐어요. 글을 길게 눌러 직접 복사해 주세요";
      }
    });
    const sh=c.querySelector(".share");
    if(sh) sh.addEventListener("click",async()=>{
      const t=fillText(it,inp?inp.value:"",false);
      try{await navigator.share({text:t})}catch(e){
        if(e&&e.name==="AbortError")return;
        sh.textContent="공유 안 됨";setTimeout(()=>{sh.textContent="공유"},2500);
      }
    });
    host.appendChild(c);
  });
  main.appendChild(sec);
});
updateCount();

const CAT_ORDER=["건강식품","디엘릭서","화장품","생활용품","건강기기"];
const LIB=MATERIALS.map(m=>Object.assign({cat:"수업 실습용"},m)).concat(typeof SAMPLES==="undefined"?[]:SAMPLES)
  .sort((x,y)=>CAT_ORDER.indexOf(x.cat)-CAT_ORDER.indexOf(y.cat));
(function renderLibrary(){
  const stack=document.querySelector("#sec-library .stack");
  const bar=document.createElement("div");bar.className="catbar";bar.setAttribute("role","group");bar.setAttribute("aria-label","제품 카테고리");
  bar.innerHTML=['전체'].concat(CAT_ORDER).map(c=>'<button type="button" data-cat="'+c+'" aria-pressed="'+(c==="전체")+'">'+c+' <b>'+(c==="전체"?LIB.length:LIB.filter(m=>m.cat===c).length)+'</b></button>').join("");
  const find=document.createElement("input");find.className="find";find.type="search";find.id="find-library";find.placeholder="제품 이름으로 찾기";find.setAttribute("aria-label","제품 이름으로 찾기");
  stack.appendChild(bar);stack.appendChild(find);
  let cur="전체";
  const apply=()=>{
    const q=find.value.trim().replace(/\s+/g,"").toLowerCase();
    stack.querySelectorAll("article").forEach(c=>{c.hidden=(cur!=="전체"&&c.dataset.cat!==cur)||(!!q&&!c.dataset.name.includes(q))});
    stack.querySelectorAll(".cat-head").forEach(h=>{h.hidden=!stack.querySelector('article[data-cat="'+h.dataset.cat+'"]:not([hidden])')});
  };
  bar.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.cat;
    bar.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));apply()});
  find.addEventListener("input",apply);
  let last=null;
  LIB.forEach(m=>{
    if(m.cat!==last){last=m.cat;const h=document.createElement("h3");h.className="cat-head";h.dataset.cat=m.cat;h.textContent=m.cat;stack.appendChild(h)}
    const c=document.createElement("article");c.className="card";c.dataset.cat=m.cat;c.dataset.name=m.name.replace(/\s+/g,"").toLowerCase();
    const imgs=m.files.filter(f=>f.thumb);
    c.innerHTML='<div><span class="grp">'+esc(m.cat)+'</span><h3>'+esc(m.name)+'</h3><span class="pages">파일 '+m.files.length+'개'+(m.files.some(f=>/\.pdf$/.test(f.path))?' · 설명서 있음':' · 이미지만')+'</span></div>'+
      (imgs.length?'<div class="thumbs">'+imgs.map(f=>'<img src="'+f.thumb+'" alt="'+esc(m.name+" "+f.label)+'" loading="lazy">').join("")+'</div>':'')+
      '<details class="more"><summary>파일 하나씩 받기</summary><ul class="files">'+m.files.map(f=>'<li><span>'+esc(f.label)+'</span><a href="'+f.path+'" download="'+esc(f.save)+'">받기</a></li>').join("")+'</ul></details>'+
      '<div class="actions"><button class="copy" type="button">모두 다운로드</button>'+(CAN_SHARE?'<button class="share" type="button">공유하기</button>':'')+'</div>';
    const dl=c.querySelector(".copy"),sh=c.querySelector(".share");
    dl.addEventListener("click",()=>{
      c.querySelectorAll(".files a").forEach((a,k)=>setTimeout(()=>a.click(),k*700));
      dl.textContent="다운로드를 시작했어요";setTimeout(()=>{dl.textContent="모두 다운로드"},2500);
    });
    if(sh) sh.addEventListener("click",async()=>{
      sh.textContent="준비 중";
      try{
        const files=await Promise.all(m.files.map(async f=>{const b=await (await fetch(f.path)).blob();return new File([b],f.save,{type:b.type})}));
        if(navigator.canShare&&!navigator.canShare({files})) throw new Error("unsupported");
        await navigator.share({files});sh.textContent="공유하기";
      }catch(e){
        if(e&&e.name==="AbortError"){sh.textContent="공유하기";return}
        sh.textContent="공유 안 됨";setTimeout(()=>{sh.textContent="공유하기"},2500);
      }
    });
    stack.appendChild(c);
  });
})();

function openGrp(g){
  ["setup","post"].forEach(n=>{document.getElementById("subs-"+n).hidden=n!==g;
    document.querySelector('.grp-btn[data-grp="'+n+'"]').setAttribute("aria-expanded",String(n===g))});
}
function show(id,scroll){
  const ok=id==="all"||PARTS.some(p=>p.id===id);
  document.body.classList.toggle("open",ok);
  PARTS.forEach(p=>{document.getElementById("sec-"+p.id).hidden=!((id==="all"&&p.group)||p.id===id)});
  const cur=PARTS.find(p=>p.id===id);if(cur&&cur.group)openGrp(cur.group);
  document.querySelectorAll("[data-go]").forEach(a=>{a.setAttribute("aria-current",String(ok&&a.dataset.go===id))});
  if(scroll){if(ok)chips.scrollIntoView({block:"start"});else window.scrollTo(0,0)}
}
document.addEventListener("click",e=>{
  const g=e.target.closest(".grp-btn[data-grp]");
  if(g){const open=g.getAttribute("aria-expanded")==="true";openGrp(open?null:g.dataset.grp);
    if(!open)document.getElementById("subs-"+g.dataset.grp).scrollIntoView({block:"nearest"});return}
  const a=e.target.closest("[data-go]");if(!a)return;
  e.preventDefault();const id=a.dataset.go;show(id,true);
  try{location.hash=id||"home"}catch(err){}
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1),false));
show(location.hash.slice(1),false);

const bigBtn=document.getElementById("bigBtn");
let big=false;try{big=localStorage.getItem("blogclass-big")==="1"}catch(e){}
const applyBig=()=>{document.documentElement.classList.toggle("big",big);bigBtn.textContent=big?"글자 보통":"글자 크게"};
applyBig();
bigBtn.addEventListener("click",()=>{big=!big;applyBig();try{localStorage.setItem("blogclass-big",big?"1":"0")}catch(e){}});
document.getElementById("resetBtn").addEventListener("click",()=>{
  copied.clear();save();updateCount();document.querySelectorAll(".card.done").forEach(c=>c.classList.remove("done"));
});
</script>
</body>
